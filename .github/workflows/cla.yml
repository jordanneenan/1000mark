name: CLA

# Asks each contributor to agree to CLA.md before their pull request can be merged.
# Signatures are kept on the cla-signatures branch. The action only reads the pull request's
# metadata, never its code, so pull_request_target is safe here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/jordanneenan/1000mark/blob/main/CLA.md
          branch: cla-signatures
          allowlist: jordanneenan,dependabot[bot]
          custom-notsigned-prcomment: 'Thank you for your pull request. Before it can be merged, please read the [Contributor Licence Agreement](https://github.com/jordanneenan/1000mark/blob/main/CLA.md) and agree to it by posting the comment below. You only need to do this once.'
          custom-allsigned-prcomment: 'All contributors have agreed to the Contributor Licence Agreement.'
