name: Build the computer test

# Runs only when asked (Actions tab, or `gh workflow run build.yml`) or when a version
# tag is pushed, so ordinary pushes do not use build minutes. macOS minutes cost 10x.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,   target: x86_64-unknown-linux-gnu, bin: pressmark,     out: 1000mark-linux-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   bin: pressmark.exe, out: 1000mark-windows-x86_64.exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,     bin: pressmark,     out: 1000mark-macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      bin: pressmark,     out: 1000mark-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native
          key: ${{ matrix.target }}
      - name: Build
        working-directory: native
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename
        shell: bash
        run: cp "native/target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: ${{ matrix.out }}
          if-no-files-found: error

  # On a version tag: publish the four builds as a GitHub release with their SHA-256 sums and a
  # signed record (build provenance) that they were built here, from this commit.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum 1000mark-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/1000mark-*'
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "1000Mark $GITHUB_REF_NAME" \
            --notes "The computer test for Windows, Mac (Apple silicon and Intel) and Linux, built by GitHub Actions from commit $GITHUB_SHA. SHA256SUMS.txt lists each file's fingerprint. Check a download with: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
